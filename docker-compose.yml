services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus_data:/prometheus          
    ports:
      - "9090:9090"
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana:/var/lib/grafana            
    depends_on:
      - prometheus
    restart: always

  node_exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    ports:
      - "9100:9100"
    restart: always

  db:
    image: postgres:16
    container_name: db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    volumes:
      - ./postgres_data:/var/lib/postgresql/data  
    ports:
      - "5432:5432"
    restart: always

  db_exporter:
    image: prometheuscommunity/postgres-exporter
    container_name: db_exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:password@db:5432/postgres?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      - db
    restart: always

  custom_exporter:
    image: python:3.11
    container_name: custom_exporter
    working_dir: /app
    volumes:
      - .:/app                                
    command: bash -c "pip install prometheus-client requests && python custom_exporter.py"
    ports:
      - "8000:8000"
    restart: always

networks:
  default:
    driver: bridge
